[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send every route to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the newest service worker and manifest, so app updates reach installed phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
